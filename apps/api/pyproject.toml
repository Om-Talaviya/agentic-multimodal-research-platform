[project]
name = "research-api"
version = "0.1.0"
description = "API for Agentic Multimodal Research Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.6",
    "httpx>=0.26",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "research-shared",
    "research-ai",
    "research-database",
    "research-tools",
    "research-agents",
    "research-pipeline",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "C90", "ISC", "ICN", "PIE", "T20", "PYI", "PT", "QF", "RSE", "RET", "SIM", "TCH", "TRY", "PL", "ARG", "PTH", "ERA", "PD", "PGH", "PLW", "NPY", "CPY", "DTZ", "TID", "EXE"]
ignore = ["E501", "ARG001", "ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]