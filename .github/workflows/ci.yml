name: Production CI/CD Test Suite

on:
  push:
    branches:
      - "master"
      - "main"
      - "develop/v1.1"
  pull_request:
    branches:
      - "master"
      - "main"
      - "develop/v1.1"

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Monorepo Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel hatchling
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pydantic "pydantic[email]" email-validator pydantic-settings structlog python-json-logger python-dotenv typing-extensions python-jose cryptography passlib sqlalchemy alembic slowapi aiosqlite asyncpg greenlet rank-bm25 pdfplumber pymupdf python-docx Pillow google-genai google-generativeai croniter openpyxl pandas fastapi uvicorn python-multipart anyio

      - name: Run Pytest Test Suite (612+ tests)
        env:
          PYTHONPATH: "packages/shared/src:packages/sdk-python/src:packages/ai/src:packages/database/src:packages/tools/src:packages/agents/src:packages/research/src:packages/ingestion/src:packages/retrieval/src:apps/api/src"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-only-32-chars-long"
          TESTING: "true"
        run: |
          pytest -v --timeout=90 packages/ apps/api/tests/ tests/

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend Bundle
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm run build

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: research-os-api:test

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: research-os-web:test
