name: CI Test Suite

on:
  push:
    branches: [ "master", "main", "develop/v1.1" ]
  pull_request:
    branches: [ "master", "main", "develop/v1.1" ]

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx pydantic pydantic-settings structlog python-json-logger python-dotenv typing-extensions python-jose cryptography passlib sqlalchemy alembic slowapi aiosqlite rank-bm25 pdfplumber pymupdf python-docx Pillow google-genai google-generativeai croniter openpyxl pandas fastapi uvicorn python-multipart anyio

      - name: Install Local Monorepo Packages
        run: |
          pip install -e packages/shared -e packages/ai -e packages/database -e packages/tools -e packages/agents -e packages/research -e packages/ingestion -e packages/retrieval -e apps/api --no-deps

      - name: Run Pytest Suite (329 tests)
        run: |
          pytest -v packages/ apps/api/tests/

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        working-directory: apps/web
        run: |
          npm ci || npm install
          npm run build

