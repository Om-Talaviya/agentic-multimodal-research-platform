name: CI Test Suite

on:
  push:
    branches: [ "master", "main", "develop/v1.1" ]
  pull_request:
    branches: [ "master", "main", "develop/v1.1" ]

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}/packages/shared/src:${{ github.workspace }}/packages/ai/src:${{ github.workspace }}/packages/database/src:${{ github.workspace }}/packages/tools/src:${{ github.workspace }}/packages/agents/src:${{ github.workspace }}/packages/research/src:${{ github.workspace }}/packages/ingestion/src:${{ github.workspace }}/packages/retrieval/src:${{ github.workspace }}/apps/api/src

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Base Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel hatchling
          pip install pytest pytest-asyncio pytest-cov httpx pydantic pydantic-settings structlog python-json-logger python-dotenv typing-extensions python-jose cryptography passlib sqlalchemy alembic slowapi aiosqlite rank-bm25 pdfplumber pymupdf python-docx Pillow google-genai google-generativeai croniter openpyxl pandas fastapi uvicorn python-multipart anyio

      - name: Run Pytest Suite (333 tests)
        run: |
          pytest -v packages/ apps/api/tests/

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build


