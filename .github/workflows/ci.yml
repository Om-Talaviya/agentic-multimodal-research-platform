name: CI Test Suite

on:
  push:
    branches:
      - "master"
      - "main"
      - "develop/v1.1"
  pull_request:
    branches:
      - "master"
      - "main"
      - "develop/v1.1"

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Base Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel hatchling
          pip install pytest pytest-asyncio pytest-cov httpx pydantic "pydantic[email]" email-validator pydantic-settings structlog python-json-logger python-dotenv typing-extensions python-jose cryptography passlib sqlalchemy alembic slowapi aiosqlite asyncpg greenlet rank-bm25 pdfplumber pymupdf python-docx Pillow google-genai google-generativeai croniter openpyxl pandas fastapi uvicorn python-multipart anyio

      - name: Run Pytest Suite (333 tests)
        env:
          PYTHONPATH: "packages/shared/src:packages/ai/src:packages/database/src:packages/tools/src:packages/agents/src:packages/research/src:packages/ingestion/src:packages/retrieval/src:apps/api/src"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-only-32-chars-long"
          TESTING: "true"
        run: |
          pytest -v packages/ apps/api/tests/

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build
