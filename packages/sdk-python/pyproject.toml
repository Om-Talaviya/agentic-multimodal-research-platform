[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-os"
version = "1.1.0"
description = "Official Python SDK for the Agentic Multimodal Research Platform & AI Research OS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepMind & Antigravity OS Team" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_research_os*"]
