[project]
name = "research-agents"
version = "0.1.0"
description = "Agent framework for Agentic Multimodal Research Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "research-shared",
    "research-ai",
    "research-tools",
    "research-database",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "C90", "ISC", "ICN", "PIE", "T20", "PYI", "PT", "QF", "RSE", "RET", "SIM", "TCH", "TRY", "PL", "ARG", "PTH", "ERA", "PD", "PGH", "PLW", "NPY", "CPY", "DTZ", "TID", "EXE"]
ignore = ["E501", "ARG001", "ARG002"]